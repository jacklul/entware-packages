name: Build

on:
  workflow_dispatch:
    inputs:
      build_packages:
        description: 'Packages to build and add to the listing'
        required: false
        default: ''
      remove_packages:
        description: 'Packages to remove from the listing'
        required: false
        default: ''
      prepare_args:
        description: 'Extra arguments to pass to the prepare script'
        required: false
        default: ''
      debug_packages:
        type: boolean
        required: false
        default: false
        description: Enable debug logging when compiling packages (slower compile)
      debug_tools:
        type: boolean
        required: false
        default: false
        description: Enable debug logging when compiling tools (slower compile)

jobs:
  build:
    concurrency: build-${{ github.ref_name }}-${{ matrix.arch }}
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.allow-failure }}
    if: github.event.inputs.build_packages != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64-3.10
            dir: aarch64-k3.10
            allow-failure: false
          - arch: armv7-3.2
            dir: armv7sf-k3.2
            allow-failure: false
          - arch: x64-3.2
            dir: x64-k3.2
            allow-failure: false
          #- arch: mipsel-3.4
          #  dir: mipselsf-k3.4
          #  allow-failure: true
          #- arch: mips-3.4
          #  dir: mipssf-k3.4
          #  allow-failure: true

    steps:
      - uses: actions/checkout@v6
        with:
          repository: Entware/Entware

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential flex gawk gcc-multilib gettext git libncurses5-dev libssl-dev python2 python-is-python3 python3-distutils subversion unzip zlib1g-dev rsync

      - name: Prepare configuration
        run: |
          ln -s configs/${{ matrix.arch }}.config .config
          echo "src-git self https://github.com/${GITHUB_REPOSITORY}.git;${{ github.ref_name }}" >> feeds.conf
          cat feeds.conf
          make package/symlinks
          if [ -f feeds/self/.github/prepare.sh ]; then
            bash feeds/self/.github/prepare.sh ${{ github.event.inputs.build_packages }} ${{ github.event.inputs.prepare_args }}
          fi

      - name: Create cache key
        id: cache-key
        run: |
          [ -f .cache_key ] && RESULT="$(cat .cache_key)-$(git rev-parse HEAD)" || RESULT=$(git rev-parse HEAD)
          echo "RESULT=$RESULT" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        continue-on-error: true
        id: restore-cache
        with:
          path: |
            ./bin
            ./build_dir
            ./staging_dir
          key: ${{ matrix.arch }}-${{ steps.cache-key.outputs.RESULT }}

      - name: Build tools and toolchain
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          make tools/install ${{ github.event.inputs.debug_tools == 'true' && '-j1 V=sc' || '-j$(nproc)' }}
          make toolchain/install ${{ github.event.inputs.debug_tools == 'true' && '-j1 V=sc' || '-j$(nproc)' }}
          make target/compile ${{ github.event.inputs.debug_tools == 'true' && '-j1 V=sc' || '-j$(nproc)' }}

      - uses: actions/cache/save@v5
        continue-on-error: true
        if: steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ./bin
            ./build_dir
            ./staging_dir
          key: ${{ matrix.arch }}-${{ steps.cache-key.outputs.RESULT }}

      - name: Build packages
        id: build-packages
        continue-on-error: ${{ matrix.allow-failure }}
        run: |
          PACKAGES=""
          for PACKAGE in ${{ github.event.inputs.build_packages }}; do
            export BUILD_VARIANT=
            if [[ "$PACKAGE" == *_nohf ]]; then
              if [ "${{ matrix.arch == 'armv7-2.6' || matrix.arch == 'armv7-3.2' }}" = "true" ]; then
                export BUILD_VARIANT=nohf
                PACKAGE="${PACKAGE%_nohf}"
              else
                continue
              fi
            fi
            MAKEFILE="$(find . -path "*/$PACKAGE/Makefile" -print -quit)"
            if [ -n "$MAKEFILE" ]; then
              for SUBPACKAGE in $(sed -n 's/.*BuildPackage,\([^)]*\)).*/\1/p' "$MAKEFILE" | paste -sd ' ' -); do
                case " $PACKAGES " in
                  *" $SUBPACKAGE "*) ;;
                  *) PACKAGES="${PACKAGES:+$PACKAGES }$SUBPACKAGE" ;;
                esac
              done
            fi
            make package/$PACKAGE/compile ${{ github.event.inputs.debug_packages == 'true' && '-j1 V=sc' || '-j$(nproc)' }} ${{ matrix.allow-failure && '|| true' || '' }} ; 
          done
          echo "PACKAGES=$PACKAGES" | tee -a "$GITHUB_OUTPUT"

      - name: Copy packages to artifacts directory
        run: |
          mkdir -v ./artifacts
          for PACKAGE in ${{ steps.build-packages.outputs.PACKAGES }}; do
            cp -nv ./bin/targets/*/*/packages/${PACKAGE}*.ipk ./artifacts || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dir }}
          path: ./artifacts/*

  upload:
    concurrency: upload-${{ github.ref_name }}
    needs: build
    if: always() && (needs.build.result == 'success' || github.event.inputs.build_packages == '')
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages

      - uses: actions/checkout@v6
        with:
          repository: Entware/ipk-html-indexer
          path: ipk-html-indexer

      - run: mv ipk-html-indexer ../ipk-html-indexer

      - name: Delete packages
        if: github.event.inputs.remove_packages != ''
        run: |
          PACKAGES="${{ github.event.inputs.remove_packages }}"
          for PACKAGE in $PACKAGES; do
            find . -type f -regextype posix-extended -iregex ".*/${PACKAGE}.*_[^_]*-[0-9]+\.[0-9]+\.ipk" -exec rm -fv "{}" \;
          done

      - uses: actions/download-artifact@v4
        if: github.event.inputs.build_packages != ''

      - name: Cleanup before indexing
        run: |
          find . \( -type d -name "css" -prune -exec rm -frv "{}" \; \) -o \( -type f -name "index.html" -exec rm -fv "{}" \; \) || true
          find . -type f -regextype posix-extended -iregex '.*/Packages(\.(gz|html|manifest))?$' -exec rm -fv "{}" \; || true

      - name: Run ipk-html-indexer
        run: |
          sudo ln -sv "$GITHUB_WORKSPACE/../ipk-html-indexer/mkindex.py" /usr/local/bin/mkindex.py
          sudo ln -sv "$GITHUB_WORKSPACE/../ipk-html-indexer/mkhtml.py" /usr/local/bin/mkhtml.py
          for dir in ${{ github.workspace }}/*/; do
            if [ -d "$dir" ] && ls "$dir"/*.ipk > /dev/null 2>&1; then
              bash ../ipk-html-indexer/index_feed.sh -h -f "$dir"
              sed 's#href="/css#href="../css#' -i "$dir/Packages.html"
            fi
          done
          cp -rfv ../ipk-html-indexer/css .

      - run: mv .git ../.git.bak; mv css ../css.bak

      - uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: .

      - name: Fix directory listing path in title and file permissions 
        run: |
          find . -type f -name index.html -exec sed "s|Index of .|Index of ${GITHUB_REPOSITORY##*/}|g" -i {} \; || true
          find . -type f -name index.html -exec sudo chown -v $(id -u):$(id -g) {} \; || true

      - run: mv ../.git.bak .git; mv ../css.bak css

      - run: ls -al ./ ./*/

      - run: git branch -m gh-pages gh-pages.old
        continue-on-error: true

      - uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ github.ref_name == 'master' }}
        with:
          branch: gh-pages
          folder: .
          commit-message: Upload
          single-commit: true
          force: true
          git-config-name: 'github-actions[bot]'
          git-config-email: '41898282+github-actions[bot]@users.noreply.github.com'

      - run: rm -fr .git
        if: ${{ github.ref_name != 'master' }}

      - uses: actions/upload-artifact@v7
        if: ${{ github.ref_name != 'master' }}
        with:
          name: upload
          path: .
